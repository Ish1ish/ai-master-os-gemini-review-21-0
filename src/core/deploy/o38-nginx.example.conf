server {
    listen 443 ssl http2;
    server_name ai-master-os.example.com;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # TLS certificates/keys must come from the deployment secret/certificate manager.
    ssl_certificate     /etc/ssl/ai-master-os/fullchain.pem;
    ssl_certificate_key /etc/ssl/ai-master-os/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
